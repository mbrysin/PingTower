<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PingTower</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="site-header">
        <a class="site-name" href="/"><strong>PingTower</strong></a>
    </header>

    <main>
        <h1 class="media-gallery-headline">see what’s up.</h1>

        <section
            class="tile-grid"
            id="tile-grid"
            aria-label="Website statuses"
            aria-live="polite"
        ></section>

        <p id="status-message" role="status"></p>

        <button class="button" id="load-more" type="button">
            load more
        </button>

      <button class="button" id="theme-toggle" type="button">change theme</button>
    </main>

    <footer class="site-footer">
      <div class="footer-content">
        <span>copyright © 2026 PingTower</span>
        <nav aria-label="links in footer">
          <a href="/about">about project</a>
          <a href="/contact">contacts</a>
        </nav>
        <span>russia</span>
      </div>
    </footer>

    <script src="/static/js/dashboard.js" defer></script>
</body>
</html>
