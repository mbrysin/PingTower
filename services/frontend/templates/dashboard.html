<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PingTower</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="site-header">
        <a class="site-name" href="/"><strong>PingTower</strong></a>
    </header>

    <main>
        <h1 class="media-gallery-headline">see what’s up.</h1>

        <section class="tile-grid" id="tile-grid" aria-label="Website statuses" aria-live="polite"></section>

        <p id="status-message" role="status"></p>

        <button class="button--primary" id="load-more" type="button">Load more</button>


      <button class="button--primary" id="theme-toggle" type="button">Change theme</button>
    </main>

    <footer class="site-footer">
      <div class="footer-content">
        <span>Copyright © 2026 PingTower</span>
        <nav aria-label="Links in footer">
          <a href="/about">About project</a>
          <a href="/contact">Contacts</a>
        </nav>
        <span>Russia</span>
      </div>
    </footer>

    <script src="/static/js/dashboard.js" defer></script>
</body>
</html>
