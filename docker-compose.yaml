services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    environment:
      DATABASE_URL: postgres://test:test@postgres:5432/app_db?sslmode=disable
      JWT_SECRET: testtesttesttesttesttesttesttest
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  sites:
    build:
      context: .
      dockerfile: services/sites/Dockerfile
    environment:
      DATABASE_URL: postgres://test:test@postgres:5432/app_db?sslmode=disable
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
