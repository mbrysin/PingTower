#       JWT_SECRET: testtesttesttesttesttesttesttest
#     ports:
#       - "8080:8080"
#     depends_on:
#       postgres:
#         condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - sites
      - stats
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: services/migrate/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-test}:${POSTGRES_PASSWORD:-test}@postgres:5432/${POSTGRES_DB:-app_db}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        goose -dir services/sites/migrations -table sites_goose_db_version postgres "$$DATABASE_URL" up
        goose -dir services/checker/migrations -table checker_goose_db_version postgres "$$DATABASE_URL" up
    restart: "no"

  sites:
    build:
      context: .
      dockerfile: services/sites/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-test}:${POSTGRES_PASSWORD:-test}@postgres:5432/${POSTGRES_DB:-app_db}?sslmode=disable
    expose:
      - "8081"
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/readyz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  checker:
    build:
      context: .
      dockerfile: services/checker/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-test}:${POSTGRES_PASSWORD:-test}@postgres:5432/${POSTGRES_DB:-app_db}?sslmode=disable
      REDIS_ADDR: redis:6379
      CHECK_INTERVAL: "1"
      WORKERS: "10"
      HEALTH_ADDR: ":8084"
    expose:
      - "8084"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8084/readyz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  stats:
    build:
      context: .
      dockerfile: services/stats/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-test}:${POSTGRES_PASSWORD:-test}@postgres:5432/${POSTGRES_DB:-app_db}?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_DB: "0"
      STATS_ADDR: ":8082"
    expose:
      - "8082"
    ports:
      - "127.0.0.1:8082:8082"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/readyz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: services/frontend/Dockerfile
    environment:
      ADDR: ":8083"
      GIN_MODE: release
    expose:
      - "8083"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
