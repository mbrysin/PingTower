#       JWT_SECRET: testtesttesttesttesttesttesttest
#     ports:
#       - "8080:8080"
#     depends_on:
#       postgres:
#         condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - sites
    restart: unless-stopped

  sites:
    build:
      context: .
      dockerfile: services/sites/Dockerfile
    environment:
      DATABASE_URL: postgres://test:test@postgres:5432/app_db?sslmode=disable
    expose:
      - "8081"
    depends_on:
      postgres:
        condition: service_healthy

  checker:
    build:
      context: .
      dockerfile: services/checker/Dockerfile
    environment:
      DATABASE_URL: postgres://test:test@postgres:5432/app_db?sslmode=disable
      REDIS_ADDR: redis:6379
      CHECK_INTERVAL: "1"
      WORKERS: "10"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
